<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#050607"/><title>G2 Model Viewer</title><style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#050607;color:#d8f7df}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;min-height:100%;background:#050607}body{min-height:100vh}.shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;padding:28px;background:radial-gradient(circle at 42% 38%,#17251b 0,#080b09 42%,#050607 100%)}.stage{min-width:0;display:grid;align-content:center;justify-items:center;gap:12px}.eyebrow{width:min(100%,900px);font-size:11px;letter-spacing:.16em;color:#6e9278}.stage canvas{width:min(100%,900px);height:auto;aspect-ratio:2/1;border:1px solid #314437;background:#000;image-rendering:pixelated;box-shadow:0 0 60px rgba(40,100,55,.18)}.hint{font-size:10px;color:#56705d;letter-spacing:.08em}.panel{align-self:center;border:1px solid #314437;background:#0a0f0c;border-radius:18px;padding:20px}.brand{font-size:18px;font-weight:800;letter-spacing:.08em}.status{margin-top:8px;color:#83b08e;font-size:11px;line-height:1.5}.picker{display:block;margin-top:22px;padding:12px;border:1px solid #314437;border-radius:10px;color:#b9d7bf;font-size:11px;letter-spacing:.08em;cursor:pointer}.picker input{display:block;margin-top:8px;width:100%;font:inherit}.controls{margin-top:20px;display:grid;gap:9px;font-size:11px;line-height:1.4;color:#d8f7df}.controls span{color:#789681}.readout{margin-top:20px;padding-top:14px;border-top:1px solid #26372b;color:#a7c7ad;font-size:10px;line-height:1.5}@media(max-width:820px){.shell{grid-template-columns:1fr;padding:16px}.panel{width:100%}}
</style></head><body><div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>
